syntax = "proto3";

package org.spring.divas.rating.v1;

option java_multiple_files = true;
option java_package = "org.spring.divas.rating.v1";

service RatingSyncService {
  rpc SyncDishRatings(stream RatingUpdate) returns (RatingSyncResponse);
  rpc UpdateVenueRating(RatingUpdate) returns (RatingSyncResponse);
}

message RatingUpdate {
  int64 target_id = 2;
  double average_rating = 3;
  int32 review_count = 4;
}

message RatingSyncResponse {
  int32 updated_count = 1;
}
