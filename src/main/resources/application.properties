spring.application.name=review-service
spring.config.import=resilience4j.yaml

server.port=8080
server.servlet.context-path=/api

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

order.service.url=${ORDER_SERVICE_URL}

spring.profiles.active=${SPRING_PROFILE:default}

management.tracing.sampling.probability=1.0
management.endpoint.health.probes.enabled=true
management.observations.annotations.enabled=true
management.otlp.metrics.export.enabled=false
management.endpoints.web.exposure.include=health,metrics,prometheus
management.tracing.propagation.type=w3c
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}