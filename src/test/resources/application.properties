spring.application.name=review-service
spring.config.import=resilience4j.yaml

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

order.service.url=${ORDER_SERVICE_URL:http://localhost:8085}

spring.grpc.client.channel.venue.target=static://localhost:9091

chaos-test.order-service.ordered-dish-path=/api/order/exists/dish
chaos-test.dish-review-path=/review/dish
